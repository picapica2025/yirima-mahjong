name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check tag and package version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) process.exit(1)'
      - run: npm run release
      - uses: actions/upload-artifact@v4
        with:
          name: mahjong-downloads
          path: |
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mahjong-downloads
          path: release
      - name: Publish downloadable prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/*.zip release/SHA256SUMS.txt --verify-tag --prerelease --title "谐不压怔！一日麻！ $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
